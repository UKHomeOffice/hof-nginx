load_module /usr/lib/nginx/modules/ngx_http_naxsi_module.so;

pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/naxsi_core.rules;
    default_type application/octet-stream;
    include /var/lib/nginx/runtime/logging.conf;
    server_tokens off;
    underscores_in_headers on;

    include /var/lib/nginx/runtime/gzip.conf;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/atom+xml application/javascript application/json
        application/ld+json application/manifest+json application/rss+xml
        application/vnd.geo+json application/vnd.ms-fontobject
        application/x-font-ttf application/x-web-app-manifest+json
        application/xhtml+xml application/xml font/opentype image/bmp
        image/svg+xml image/x-icon text/cache-manifest text/css text/plain
        text/vcard text/vnd.rim.location.xloc text/vtt text/x-component
        text/x-cross-domain-policy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    include /var/lib/nginx/runtime/rate-limit.conf;
    include /var/lib/nginx/runtime/server.conf;
}
