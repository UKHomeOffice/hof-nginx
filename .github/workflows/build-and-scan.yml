name: Build and scan image

on:
  push:
    branches: [main, 'feature/**']
    tags: ['*']
  pull_request:
    branches: [main, 'feature/**']
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token for shared Trivy allow list
        if: github.event_name != 'pull_request'
        id: config-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.UKHO_GH_APP_ID }}
          private-key: ${{ secrets.UKHO_GH_APP_PK }}
          owner: UKHomeOfficeForms
          repositories: hof-services-config
          permission-contents: read

      - name: Checkout shared Trivy allow list
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UKHomeOfficeForms/hof-services-config
          token: ${{ steps.config-token.outputs.token }}
          path: hof-services-config
          sparse-checkout: infrastructure/trivy
          persist-credentials: false

      - name: Enable arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Build image
        run: docker buildx build --pull --no-cache --platform linux/${{ matrix.arch }} --load -t hof-nginx:scan .

      - name: Run smoke tests
        run: bash tests/smoke.sh hof-nginx:scan

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Scan image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            ignorefile=/dev/null
            echo "Pull request: scanning without the private allow list."
          else
            ignorefile="$GITHUB_WORKSPACE/hof-services-config/infrastructure/trivy/.trivyignore.yaml"
            test -f "$ignorefile"
          fi
          trivy image --scanners vuln --pkg-types os,library --dependency-tree \
            --severity MEDIUM,HIGH,CRITICAL --ignorefile "$ignorefile" \
            --exit-code 1 hof-nginx:scan
