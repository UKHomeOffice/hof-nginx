<!DOCTYPE html>
<html lang="en" class="govuk-template govuk-template--rebranded">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><!--#echo var="title" --> &ndash; GOV.UK</title>
    <link rel="stylesheet" href="/public/css/app.css">
  </head>
  <body class="govuk-template__body">
    <a href="#content" class="govuk-skip-link">Skip to main content</a>
    <header class="govuk-header" role="banner">
      <div class="govuk-header__container govuk-width-container">
        <div class="govuk-header__logo">
          <a href="https://www.gov.uk/" class="govuk-header__link govuk-header__link--homepage">
            <img src="/public/images/govuk-logo.svg" alt="GOV.UK">
          </a>
        </div>
      </div>
    </header>

    <div class="govuk-width-container">
      <main id="content" class="govuk-main-wrapper">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">
            <h1 class="govuk-heading-xl"><!--#echo var="title" --></h1>
            <!--#include file="partials/$partial.shtml" -->
            <p class="govuk-body">
              <a href="javascript:window.history.back()" class="govuk-link">Back</a>
              <a href="/" class="govuk-link">Start again</a>
            </p>
            <!--#if expr="$verbose_error_pages = TRUE" -->
              <p class="govuk-body">
                Generated at <!--#config timefmt="%H:%M:%S %Z" --><!--#echo var="date_local" -->
                on <!--#config timefmt="%A, %d %B %Y" --><!--#echo var="date_local" -->.
              </p>
            <!--#endif -->
          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" role="contentinfo">
      <div class="govuk-width-container">
        <div class="govuk-footer__meta">
          <div class="govuk-footer__meta-item govuk-footer__meta-item--grow">
            <h2 class="govuk-visually-hidden">Support links</h2>
            <ul class="govuk-footer__inline-list">
              <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="/cookies">Cookies</a></li>
              <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="/terms-and-conditions">Terms and conditions</a></li>
              <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="/accessibility">Accessibility statement</a></li>
            </ul>
            <p class="govuk-footer__licence-description">
              All content is available under the
              <a class="govuk-footer__link" href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/" rel="license">Open Government Licence v3.0</a>,
              except where otherwise stated.
            </p>
          </div>
          <div class="govuk-footer__meta-item">
            <a class="govuk-footer__link govuk-footer__copyright-logo" href="https://www.nationalarchives.gov.uk/information-management/our-services/crown-copyright.htm">&copy; Crown copyright</a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
